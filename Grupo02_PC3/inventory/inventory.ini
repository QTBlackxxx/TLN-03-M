[MPLS_update]
clab-MPLS-PE1
clab-MPLS-PE2
clab-MPLS-P1
clab-MPLS-P2
clab-MPLS-RR1
clab-MPLS-RR2
clab-MPLS-SW-1
clab-MPLS-SW-2
clab-MPLS-CPE-1
clab-MPLS-CPE-2
clab-MPLS-SW-LAN-1
clab-MPLS-SW-LAN-2

[MPLS_update:vars]
ansible_user=admin
ansible_password=admin
ansible_network_os=cisco.ios.ios
ansible_connection=ansible.netcommon.network_cli
ansible_paramiko_look_for_keys=False

# =============================================================
#  Inventario MPLS L3VPN - Ansible
# =============================================================

# ------------------------------------------------------------------
# Routers PE  →  clientes RR  |  IPv4 unicast + VPNv4 + VPNv6
# ------------------------------------------------------------------
[PE_routers]
clab-MPLS-PE1
clab-MPLS-PE2

# ------------------------------------------------------------------
# Routers P   →  clientes RR  |  solo IPv4 unicast
# ------------------------------------------------------------------
[P_routers]
clab-MPLS-P1
clab-MPLS-P2

# ------------------------------------------------------------------
# Route Reflectors  →  reflejan a PE y P según address-family
# ------------------------------------------------------------------
[RR_routers]
clab-MPLS-RR1
clab-MPLS-RR2

# ------------------------------------------------------------------
# Grupo que agrupa los tres roles anteriores
# ------------------------------------------------------------------
[MPLS_core:children]
PE_routers
P_routers
RR_routers

###############################################################
