# =============================================================
#  Inventario MPLS L3VPN - Ansible
# =============================================================

# ------------------------------------------------------------------
# Routers PE  →  clientes RR  |  IPv4 unicast + VPNv4 + VPNv6
# ------------------------------------------------------------------
[PE_routers]
clab-MPLS-PE1
clab-MPLS-PE2

# ------------------------------------------------------------------
# Routers P   →  clientes RR  |  solo IPv4 unicast
# ------------------------------------------------------------------
[P_routers]
clab-MPLS-P1
clab-MPLS-P2

# ------------------------------------------------------------------
# Route Reflectors  →  reflejan a PE y P según address-family
# ------------------------------------------------------------------
[RR_routers]
clab-MPLS-RR1
clab-MPLS-RR2

# ------------------------------------------------------------------
# Grupo que agrupa los tres roles anteriores
# ------------------------------------------------------------------
[MPLS_core:children]
PE_routers
P_routers
RR_routers

###############################################################
# inventory.ini
# Inventario Ansible para red MPLS L3VPN
# Topología definida en MPLS-IOU.yml
###############################################################

# --------------------------------------------------------------
# Grupo 1: Todos los routers del core MPLS (AS 100)
# Usado por: interfaces.yml, ospf.yml, mpls.yml, bgp.yml
# --------------------------------------------------------------
[MPLS_routers]
clab-MPLS-PE1
clab-MPLS-PE2
clab-MPLS-P1
clab-MPLS-P2
clab-MPLS-RR1
clab-MPLS-RR2

[MPLS_routers:vars]
ansible_user=admin
ansible_password=admin
ansible_network_os=cisco.ios.ios
ansible_connection=ansible.netcommon.network_cli
ansible_paramiko_look_for_keys=False

# --------------------------------------------------------------
# Grupo 2: Solo PE1 y PE2
# Usado por: vpn.yml (VRF + subinterfaces + BGP VPNv4/v6)
# --------------------------------------------------------------
[MPLS_PE1_PE2]
clab-MPLS-PE1
clab-MPLS-PE2

[MPLS_PE1_PE2:vars]
ansible_user=admin
ansible_password=admin
ansible_network_os=cisco.ios.ios
ansible_connection=ansible.netcommon.network_cli
ansible_paramiko_look_for_keys=False

# --------------------------------------------------------------
# Grupo 3: Switches de acceso (L2)
# Usado por: vpn.yml (si se extiende para configurar SW-1 / SW-2)
# --------------------------------------------------------------
[MPLS_switches]
clab-MPLS-SW-1
clab-MPLS-SW-2

[MPLS_switches:vars]
ansible_user=admin
ansible_password=admin
ansible_network_os=cisco.ios.ios
ansible_connection=ansible.netcommon.network_cli
ansible_paramiko_look_for_keys=False

# --------------------------------------------------------------
# Grupo 4: CPEs de cada sede del Cliente A
# Usado por: vpn.yml si se agrega task para CPEs
# --------------------------------------------------------------
[MPLS_CPEs]
clab-MPLS-CPE-1
clab-MPLS-CPE-2

[MPLS_CPEs:vars]
ansible_user=admin
ansible_password=admin
ansible_network_os=cisco.ios.ios
ansible_connection=ansible.netcommon.network_cli
ansible_paramiko_look_for_keys=False

# ------------------------------------------------------------------
# Variables comunes a todos los dispositivos del core
# ------------------------------------------------------------------
[MPLS_core:vars]
ansible_user=admin
ansible_password=admin
ansible_network_os=cisco.ios.ios
ansible_connection=ansible.netcommon.network_cli
ansible_paramiko_look_for_keys=False