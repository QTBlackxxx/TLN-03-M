    - endpoints: [ "CPE-BRANCH2-BK:e0/2", "SW-R2-PISO1:e1/1" ]
    - endpoints: [ "SW-R2-PISO1:e0/3", "PC1-R2-VLAN5:eth1" ]
    - endpoints: [ "SW-R2-PISO1:e1/0", "PC2-R2-VLAN5:eth1" ]
    - endpoints: [ "SW-R2-PISO1:e0/2", "PC3-R2-VLAN15:eth1" ]
    - endpoints: [ "SW-R2-PISO1:e1/2", "PC4-R2-VLAN15:eth1" ]