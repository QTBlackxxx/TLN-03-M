---
- name: Playbook 1 - Configuracion de Interfaces
  hosts: MPLS_update
  gather_facts: false
  tasks:
    - name: Aplicar configuracion de interfaces en PE1
      cisco.ios.ios_config:
        lines:
          - interface lo0
          - ip address 172.16.1.1 255.255.255.255
          - interface e0/1
          - description Conexion con RR1
          - ip address 10.0.0.1 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/2
          - description Conexion con P1
          - ip address 10.0.0.5 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/3
          - description Conexion con P2
          - ip address 10.0.0.9 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
      when: inventory_hostname == "clab-MPLS-PE1"

    - name: Aplicar configuracion de interfaces en PE2
      cisco.ios.ios_config:
        lines:
          - interface lo0
          - ip address 172.16.1.2 255.255.255.255
          - interface e0/1
          - description Conexion con P1
          - ip ospf network point-to-point
          - ip address 10.0.0.30 255.255.255.252
          - no shutdown
          - interface e0/2
          - description Conexion con P2
          - ip ospf network point-to-point
          - ip address 10.0.0.34 255.255.255.252
          - no shutdown
          - interface e0/3
          - description Conexion con RR2
          - ip ospf network point-to-point
          - ip address 10.0.0.38 255.255.255.252
          - no shutdown
      when: inventory_hostname == "clab-MPLS-PE2"

    - name: Aplicar configuracion de interfaces en P1
      cisco.ios.ios_config:
        lines:
          - interface lo0
          - ip address 172.16.1.4 255.255.255.255
          - interface e0/1
          - description Conexion con PE1
          - ip address 10.0.0.6 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/2
          - description Conexion con RR1
          - ip address 10.0.0.18 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/3
          - description Conexion con P2
          - ip address 10.0.0.21 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e1/0
          - description Conexion con RR2
          - ip address 10.0.0.25 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e1/1
          - description Conexion con PE2
          - ip address 10.0.0.29 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
      when: inventory_hostname == "clab-MPLS-P1"

    - name: Aplicar configuracion de interfaces en P2
      cisco.ios.ios_config:
        lines:
          - interface lo0
          - ip address 172.16.1.3 255.255.255.255
          - interface e0/1
          - description Conexion con PE1
          - ip address 10.0.0.10 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/2
          - description Conexion con P1
          - ip address 10.0.0.22 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/3
          - description Conexion con PE2
          - ip address 10.0.0.33 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
      when: inventory_hostname == "clab-MPLS-P2"

    - name: Aplicar configuracion de interfaces en RR1
      cisco.ios.ios_config:
        lines:
          - interface lo0
          - ip address 172.16.1.5 255.255.255.255
          - interface e0/1
          - description Conexion con PE1
          - ip address 10.0.0.2 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/2
          - description Conexion con P1
          - ip address 10.0.0.17 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/3
          - description Conexion con RR2
          - ip address 10.0.0.13 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
      when: inventory_hostname == "clab-MPLS-RR1"

    - name: Aplicar configuracion de interfaces en RR2
      cisco.ios.ios_config:
        lines:
          - interface lo0
          - ip address 172.16.1.6 255.255.255.255
          - interface e0/1
          - description Conexion con RR1
          - ip address 10.0.0.14 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/2
          - description Conexion con P1
          - ip address 10.0.0.26 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
          - interface e0/3
          - description Conexion con PE2
          - ip address 10.0.0.37 255.255.255.252
          - ip ospf network point-to-point
          - no shutdown
      when: inventory_hostname == "clab-MPLS-RR2"

    - name: Aplicar configuracion de interfaces en CPE_1
      cisco.ios.ios_config:
        lines:
          - interface e0/1
          - description Conexion con PE1
          - ip address 10.0.1.2 255.255.255.252
          - ipv6 add FC10::2/64
          - no shutdown
          - interface e0/2
          - description Conexion con LAN
          - ip address 192.168.10.1 255.255.255.0
          - ipv6 address 2001:192:168:10::1/64
          - no shutdown
      when: inventory_hostname == "clab-MPLS-CPE-1"

    - name: Aplicar configuracion de interfaces en CPE_2
      cisco.ios.ios_config:
        lines:
          - interface e0/1
          - description Conexion con PE2
          - ip address 10.0.2.2 255.255.255.252
          - ipv6 add FC20::2/64
          - no shutdown
          - interface e0/2
          - description Conexion con LAN
          - ip address 192.168.20.1 255.255.255.0
          - ipv6 address 2001:192:168:20::1/64
          - no shutdown
      when: inventory_hostname == "clab-MPLS-CPE-2"

    - name: Aplicar VLANs e interfaces en SW_1
      cisco.ios.ios_config:
        lines:
          - vlan 10
          - name Cliente_A
          - interface e0/1
          - description Conexion con PE1
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk allowed vlan add 10
          - no shutdown
          - interface e0/2
          - description Conexion con Cliente A
          - switchport mode access
          - switchport access vlan 10
          - no shutdown
      when: inventory_hostname == "clab-MPLS-SW-1"

    - name: Aplicar VLANs e interfaces en SW_2
      cisco.ios.ios_config:
        lines:
          - vlan 10
          - name Cliente_A
          - interface e0/1
          - description Conexion con PE2
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk allowed vlan add 10
          - no shutdown
          - interface e0/2
          - description Conexion con Cliente A
          - switchport mode access
          - switchport access vlan 10
          - no shutdown
      when: inventory_hostname == "clab-MPLS-SW-2"