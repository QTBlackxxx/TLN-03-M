global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'containerlab_cisco_routers'
    static_configs:
      - targets:
        - 172.20.20.2  # IP de clab-NETCONF-PE2
        - 172.20.20.3  # IP de clab-NETCONF-PE1
    metrics_path: /snmp
    params:
      module: [if_mib] # Módulo estándar MIB para interfaces Cisco
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: 'telegraf_netconf_metrics'
    static_configs:
      - targets: ['telegraf:9273'] # Apunta al contenedor de Telegraf