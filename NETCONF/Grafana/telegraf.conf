[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"

# --- RECOLECTOR NETCONF PARA CSR1000v PE1 y PE2 ---
[[inputs.netconf]]
  ## Direcciones de tus routers de Containerlab
  targets = ["172.20.20.2:830", "172.20.20.3:830"]
  
  ## Credenciales de acceso
  username = "admin"
  password = "admin"
  
  ## Tiempo de espera de la sesión
  timeout = "30s"

  ## Consulta YANG / XPath estructurada (Ejemplo: Estado básico de Interfaces)
  [[inputs.netconf.query]]
    name = "cisco_interfaces"
    xml = """
    <get>
      <filter type="xpath" select="/interfaces-state/interface"/>
    </get>
    """

# --- SALIDA HACIA PROMETHEUS ---
[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
